; =============================================================================
; PHP 8.4 - Additional Configuration Directives (Otimizado)
; Servidor: 24GB RAM / 8 vCPUs | WordPress + WP Rocket + Newspaper Theme
; =============================================================================

; --- GERAL ---
date.timezone=America/Sao_Paulo
display_errors=Off
short_open_tag=Off
max_execution_time=300
max_input_time=300
max_input_vars=5000
memory_limit=512M
post_max_size=64M
upload_max_filesize=64M

; --- SESSAO ---
session.gc_maxlifetime=1440
session.cookie_httponly=1
session.cookie_secure=1
session.use_strict_mode=1

; --- OPCACHE (Motor Principal de Performance) ---
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=512
opcache.interned_strings_buffer=128
opcache.max_accelerated_files=65000
opcache.max_wasted_percentage=10
opcache.save_comments=1
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.optimization_level=0x7FFF
opcache.huge_code_pages=1

; --- JIT (PHP 8.4) ---
opcache.jit=tracing
opcache.jit_buffer_size=256M

; --- REALPATH CACHE ---
realpath_cache_size=8M
realpath_cache_ttl=7200
