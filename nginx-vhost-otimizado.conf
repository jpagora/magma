# =============================================================================
# NGINX VHOST OTIMIZADO - jpagora.com
# Servidor: 24GB RAM / 8 vCPUs | PHP 8.4 | Varnish + Redis + WP Rocket
# =============================================================================

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  listen 443 quic;
  listen [::]:443 quic;

  http2 on;
  http3 on;
  add_header Alt-Svc 'h3=":443"; ma=86400';

  {{ssl_certificate_key}}
  {{ssl_certificate}}

  server_name www.jpagora.com;
  return 301 https://jpagora.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  listen 443 quic;
  listen [::]:443 quic;

  http2 on;
  http3 on;
  add_header Alt-Svc 'h3=":443"; ma=86400';

  {{ssl_certificate_key}}
  {{ssl_certificate}}

  server_name jpagora.com www1.jpagora.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  # Redirecionamento HTTPS
  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }

  # =========================================================================
  # HEADERS DE SEGURANCA GLOBAIS
  # =========================================================================
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # =========================================================================
  # AREA RESTRITA
  # =========================================================================
  location /ferramentas/ {
    auth_basic "Area Restrita - JP Agora";
    auth_basic_user_file /home/jpagora/htdocs/jpagora.com/ferramentas/.htpasswd;
    try_files $uri $uri/ /ferramentas/index.html;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  # =========================================================================
  # SEGURANCA
  # =========================================================================
  location ~ /\.git { deny all; }
  location = /xmlrpc.php { deny all; access_log off; log_not_found off; }
  location = /wp-config.php { deny all; access_log off; log_not_found off; }
  location ~ /\.ht { deny all; access_log off; log_not_found off; }
  location ~ /\.env { deny all; access_log off; log_not_found off; }

  # =========================================================================
  # SEOPRESS (Sitemaps)
  # =========================================================================
  location ~ (([^/]*)sitemap(.*)|news|author|video(.*))\.x(m|s)l$ {
    rewrite ^.*/sitemaps\.xml$ /index.php?seopress_sitemap=1 last;
    rewrite ^.*/news.xml$ /index.php?seopress_news=1 last;
    rewrite ^.*/video([0-9]+)?\.xml$ /index.php?seopress_video=1&seopress_paged=$1 last;
    rewrite ^.*/author\.xml$ /index.php?seopress_author=1 last;
    rewrite ^.*/sitemaps_xsl\.xsl$ /index.php?seopress_sitemap_xsl=1 last;
    rewrite ^.*/sitemaps_video_xsl\.xsl$ /index.php?seopress_sitemap_video_xsl=1 last;
    rewrite ^.*/([^/]+?)-sitemap([0-9]+)?\.xml$ /index.php?seopress_cpt=$1&seopress_paged=$2 last;
  }

  # =========================================================================
  # WP-ADMIN / WP-LOGIN (Bypass Varnish - direto pro backend)
  # =========================================================================
  location ~* /(wp-admin/|wp-login\.php|wp-cron\.php) {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8080;

    proxy_max_temp_file_size 0;
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }

  # =========================================================================
  # FRONTEND (Via Varnish)
  # =========================================================================
  location / {
    {{varnish_proxy_pass}}
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Varnish;
    proxy_redirect off;

    add_header X-Cache-Enabled "True";

    proxy_max_temp_file_size 0;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }

  # =========================================================================
  # ARQUIVOS ESTATICOS - Cache Agressivo
  # =========================================================================
  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|avif|zip|swf|map)$ {
    # WordPress Multisite Subdirectory
    rewrite ^/[_0-9a-zA-Z-]+(/wp-.*) $1 break;
    rewrite ^/[_0-9a-zA-Z-]+(/.*\.php)$ $1 break;

    # Cache de 1 ano com immutable
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    add_header Alt-Svc 'h3=":443"; ma=86400';

    access_log off;
    log_not_found off;

    # Cache de descritores de arquivos (otimizado para 24GB RAM)
    open_file_cache max=8000 inactive=180s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;
  }

  # =========================================================================
  # BLOQUEAR ACESSO A ARQUIVOS SENSIVEIS
  # =========================================================================
  location ~* \.(sql|bak|log|old|orig|tmp)$ {
    deny all;
    access_log off;
    log_not_found off;
  }

  if (-f $request_filename) {
    break;
  }
}

# =============================================================================
# BACKEND (PHP 8.4 via FastCGI)
# =============================================================================
server {
  listen 8080;
  listen [::]:8080;
  server_name jpagora.com www1.jpagora.com;
  {{root}}

  include /etc/nginx/global_settings;

  try_files $uri $uri/ /index.php?$args;
  index index.php index.html;

  # =========================================================================
  # FASTCGI - PHP 8.4
  # =========================================================================
  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;

    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;

    # Timeouts (reduzidos - 600s e excessivo para frontend)
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;

    # Buffers: NAO definir aqui - ja vem do global_settings do CloudPanel
    # Se precisar ajustar, edite /etc/nginx/global_settings

    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  # Regras Multisite
  if (!-e $request_filename) {
    rewrite /wp-admin$ https://$host$uri permanent;
    rewrite ^/[_0-9a-zA-Z-]+(/wp-admin/.*) $1 last;
    rewrite ^/[_0-9a-zA-Z-]+(/.*\.php)$ $1 last;
  }

  if (-f $request_filename) {
    break;
  }
}
